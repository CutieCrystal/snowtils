
name: Build Snowtils Fabric Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Gradle Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not detect Gradle version"
            exit 1
          fi

          URL="https://services.gradle.org/distributions/gradle-${VERSION}-wrapper.jar"

          curl -fsSL "$URL" -o gradle/wrapper/gradle-wrapper.jar
          curl -fsSL "${URL}.sha256" -o /tmp/wrapper.sha256

          echo "$(cat /tmp/wrapper.sha256)  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Build Fabric mod
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: snowtils-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
